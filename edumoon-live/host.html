<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EduMoon Live Host</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito+Sans:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="style.css">
<style>
/* Host screen: built to be screen-shared on Zoom, so everything is big and readable at a glance. */
.stage{display:flex;flex-direction:column;gap:22px}
.bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.pill{font-size:14px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:8px 16px;border-radius:99px;background:var(--fuel);color:#1F1600}
.pill.alt{background:var(--panel);color:var(--soft);border:1px solid var(--line)}
.timer{margin-left:auto;display:flex;align-items:center;gap:12px}
.tnum{font-family:var(--display);font-weight:700;font-size:44px;min-width:70px;text-align:right;font-variant-numeric:tabular-nums}
.tnum.low{color:var(--miss)}
.ttrack{width:min(240px,30vw);height:12px;border-radius:6px;background:#1B2577;overflow:hidden}
.ttrack i{display:block;height:100%;background:var(--sky);transition:width .2s linear}
.qrow{display:flex;gap:18px;align-items:center}
.q{font-size:clamp(30px,4vw,52px);line-height:1.12}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:700px){.opts{grid-template-columns:1fr}}
.opt{display:flex;align-items:center;gap:16px;border-radius:20px;padding:22px 24px;min-height:96px;font-weight:800;font-size:clamp(20px,2.2vw,28px);position:relative;overflow:hidden}
.opt .sym{font-size:28px;flex:none}
.opt .cnt{margin-left:auto;font-family:var(--display);font-size:30px}
.opt.dim{opacity:.28}
.opt.right{outline:5px solid var(--moon);outline-offset:-5px}
.answered{font-size:20px;font-weight:700;color:var(--soft)}
.answered b{color:var(--moon);font-family:var(--display);font-size:28px}
.foot{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.foot .grow{flex:1}
.learn{display:flex;gap:18px;align-items:center;background:linear-gradient(135deg,#123A9C,#1F5FD6);border-radius:22px;padding:22px 26px}
.learn p{font-size:clamp(18px,2vw,24px);line-height:1.45;max-width:62ch}
.big{font-family:var(--display);font-weight:700;font-size:clamp(40px,6vw,80px);color:var(--win);letter-spacing:.04em}
/* lobby */
.lobby{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:22px}
@media (max-width:900px){.lobby{grid-template-columns:1fr}}
.joinbox{display:flex;flex-direction:column;gap:18px}
.code{font-family:var(--display);font-weight:700;font-size:clamp(64px,10vw,120px);letter-spacing:.12em;color:var(--fuel);line-height:1}
.url{font-size:18px;font-weight:700;word-break:break-all;background:#0B124F;border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.qr{background:#F3F6FC;border-radius:18px;padding:14px;width:fit-content}
.qr img,.qr canvas{display:block;width:200px;height:200px}
.chips{display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:10px 18px;font-weight:800;font-size:18px;animation:pop .4s}
.count{font-family:var(--display);font-size:56px;font-weight:700;line-height:1}
/* hangman */
.hang{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:22px;align-items:start}
@media (max-width:900px){.hang{grid-template-columns:1fr}}
.feed{display:flex;flex-direction:column;gap:8px;max-height:300px;overflow:hidden}
.feed div{background:#0B124F;border-radius:12px;padding:10px 14px;font-weight:700;font-size:16px;animation:pop .35s}
.feed b{font-family:var(--display);font-size:20px;margin-right:6px}
.feed .ok b{color:var(--win)} .feed .no b{color:var(--miss)}
.wrongs{font-family:var(--display);font-size:24px;color:var(--miss);letter-spacing:.2em;min-height:30px}
/* board */
.board{display:flex;flex-direction:column;gap:12px;max-width:820px;width:100%;margin:0 auto}
.brow{display:grid;grid-template-columns:56px minmax(0,1fr) auto auto;gap:14px;align-items:center;background:var(--deep);border:1px solid var(--line);border-radius:18px;padding:14px 20px;animation:rise .45s backwards}
.brow:nth-child(1){border-color:var(--fuel)}
.brow .rk{font-family:var(--display);font-size:30px;font-weight:700;color:var(--soft);text-align:center}
.brow:nth-child(1) .rk{color:var(--fuel)}
.brow .nm{font-size:24px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .gain{font-weight:800;color:var(--win);font-size:18px}
.brow .sc{font-family:var(--display);font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;min-width:90px;text-align:right}
@keyframes rise{from{transform:translateY(16px);opacity:0}}
.podium{display:flex;gap:16px;justify-content:center;align-items:flex-end;flex-wrap:wrap}
.pod{width:min(220px,30vw);display:flex;flex-direction:column;align-items:center;gap:10px}
.pod .blk{width:100%;border-radius:18px 18px 0 0;display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:48px;color:#1F1600}
.pod .who{font-size:22px;font-weight:800;text-align:center;overflow-wrap:anywhere}
.pod .pts{color:var(--soft);font-weight:700}
.center{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <img src="icon.png" alt="EduMoon">
    <div class="brand"><small id="club">EduMoon Live</small><b id="title">Loading…</b></div>
    <span class="mode" id="mode">Connecting…</span>
  </div>
  <main class="stage" id="stage" aria-live="polite"></main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="firebase-config.js"></script>
<script src="questions.js"></script>
<script src="game.js"></script>
<script>
const R = SESSION.rounds, N = R.length;
let code, base, players = {}, answers = {}, hang = {}, phase = "lobby", qi = -1, endsAt = 0, finalized = {}, view = {}, unsub = [];
const $ = s => document.querySelector(s);

function joinURL() {
  const u = new URL(window.EDUMOON_PLAYER_PAGE || "index.html", location.href); u.search = "?room=" + code; return u.href;
}
function playerList() { return Object.entries(players || {}).map(([id, p]) => ({ id, ...p })); }
function ranked() { return playerList().sort((a, b) => (b.score || 0) - (a.score || 0) || String(a.name).localeCompare(b.name)); }

async function boot() {
  await DB.init();
  $("#mode").textContent = DB.mode === "live" ? "Live" : "Demo mode";
  $("#mode").className = "mode " + DB.mode;
  $("#mode").title = DB.mode === "live" ? "Connected to Firebase" : "Demo mode: players must open the game in other tabs on this computer";
  $("#club").textContent = "EduMoon Live · " + SESSION.club;
  $("#title").textContent = SESSION.title;
  code = H.ss("edumoon-host-code");
  const existing = code ? await DB.get(`rooms/${code}/state`) : null;
  if (!existing) { code = H.code(); H.ss("edumoon-host-code", code); await DB.set(`rooms/${code}`, { state: { phase: "lobby", total: N, title: SESSION.title, club: SESSION.club, created: DB.now() } }); }
  else { phase = existing.phase; qi = existing.q ?? -1; endsAt = existing.endsAt || 0; if (phase === "question") listenRound(qi); }
  base = `rooms/${code}`;
  DB.on(`${base}/players`, v => { players = v || {}; onChange(); });
  setInterval(tick, 200);
  document.addEventListener("keydown", e => {
    if (e.target.tagName === "INPUT") return;
    if (e.key === "Enter" || e.key === " ") { const b = document.querySelector("[data-main]"); if (b && !b.disabled) { e.preventDefault(); b.click(); } }
  });
  render();
}

function onChange() {
  if (phase === "question") checkDone();
  render();
}

function listenRound(i) {
  unsub.forEach(f => f()); unsub = []; answers = {}; hang = {};
  unsub.push(DB.on(`${base}/answers/${i}`, v => { answers = v || {}; onChange(); }));
  if (R[i].type === "hangman") unsub.push(DB.on(`${base}/hang/${i}`, v => { hang = v || {}; syncHang(); onChange(); }));
}

async function startRound(i) {
  const r = R[i]; qi = i; phase = "question";
  endsAt = DB.now() + r.time * 1000;
  const st = { phase, q: i, total: N, type: r.type, prompt: r.q, endsAt, dur: r.time, title: SESSION.title, club: SESSION.club };
  if (r.type === "mcq") st.options = r.options;
  if (r.type === "tf") st.options = ["True", "False"];
  if (r.type === "hangman") { st.mask = H.mask(r.word, []); st.wrong = []; st.fuel = H.MAX_WRONG; st.hint = r.hint || ""; }
  listenRound(i);
  await DB.set(`${base}/state`, st);
  render();
}

// Hangman: turn the letters players claimed into the shared word state.
function hangState() {
  const r = R[qi], word = r.word, inWord = new Set(H.letters(word));
  const claims = Object.entries(hang.letters || {}).map(([L, c]) => ({ L, ...c })).sort((a, b) => a.t - b.t);
  const found = claims.filter(c => inWord.has(c.L)).map(c => c.L);
  const wrong = claims.filter(c => !inWord.has(c.L)).map(c => c.L);
  let solved = null;
  const tries = Object.entries(hang.tries || {}).map(([pid, t]) => ({ pid, ...t })).sort((a, b) => a.t - b.t);
  for (const t of tries) if (H.norm(t.w) === H.norm(word)) { solved = t; break; }
  const allFound = H.letters(word).every(L => found.includes(L));
  return { claims, found, wrong, solved, allFound, out: wrong.length >= H.MAX_WRONG };
}
let lastHang = "";
function syncHang() {
  if (phase !== "question" || R[qi].type !== "hangman") return;
  const s = hangState(), r = R[qi];
  const mask = s.solved ? r.word : H.mask(r.word, s.found);
  const sig = mask + "|" + s.wrong.join("");
  if (sig !== lastHang) { lastHang = sig; DB.update(`${base}/state`, { mask, wrong: s.wrong, fuel: Math.max(0, H.MAX_WRONG - s.wrong.length) }); }
}

function checkDone() {
  const r = R[qi]; if (!r) return;
  if (r.type === "hangman") { const s = hangState(); if (s.solved || s.allFound || s.out) reveal(); return; }
  const n = playerList().length;
  if (n > 0 && Object.keys(answers).length >= n) reveal();
}

function tick() {
  if (phase !== "question") return;
  const left = Math.max(0, endsAt - DB.now()), dur = R[qi].time * 1000;
  const t = $("#tnum"), b = $("#tbar");
  if (t) { t.textContent = Math.ceil(left / 1000); t.classList.toggle("low", left < 5000); }
  if (b) b.style.width = (100 * left / dur) + "%";
  if (left <= 0) reveal();
}

async function reveal() {
  if (finalized[qi] || phase !== "question") return;
  finalized[qi] = true; phase = "reveal";
  const r = R[qi], gain = {};
  playerList().forEach(p => gain[p.id] = 0);
  let st = { phase, q: qi, total: N, type: r.type, prompt: r.q, learn: r.learn, title: SESSION.title, club: SESSION.club };
  if (r.type === "hangman") {
    const s = hangState();
    s.claims.forEach(c => { if (H.letters(r.word).includes(c.L) && c.pid in gain) gain[c.pid] += H.LETTER_PTS; });
    if (s.solved && s.solved.pid in gain) gain[s.solved.pid] += H.SOLVE_PTS;
    st.correct = r.word; st.mask = r.word; st.solvedBy = s.solved ? (players[s.solved.pid]?.name || "") : ""; st.won = !!(s.solved || s.allFound);
    view.hang = s;
  } else {
    const counts = r.type === "tf" ? [0, 0] : r.type === "mcq" ? [0, 0, 0, 0] : null;
    let right = 0;
    for (const [pid, a] of Object.entries(answers)) {
      let ok = false;
      if (r.type === "mcq") { ok = a.a === r.answer; counts[a.a] = (counts[a.a] || 0) + 1; }
      if (r.type === "tf") { const idx = a.a === true ? 0 : 1; counts[idx]++; ok = a.a === r.answer; }
      if (r.type === "type") ok = r.answers.some(x => H.norm(x) === H.norm(a.a));
      if (ok) { right++; if (pid in gain) gain[pid] = H.speedPoints(a.t, endsAt, r.time); }
    }
    st.counts = counts; st.right = right;
    st.correct = r.type === "mcq" ? r.answer : r.type === "tf" ? (r.answer ? 0 : 1) : r.answers[0];
    if (r.type === "mcq") st.options = r.options; if (r.type === "tf") st.options = ["True", "False"];
  }
  const upd = {};
  for (const p of playerList()) { upd[`${p.id}/score`] = (p.score || 0) + gain[p.id]; upd[`${p.id}/last`] = gain[p.id]; }
  if (Object.keys(upd).length) await DB.update(`${base}/players`, upd);
  await DB.set(`${base}/state`, st);
  view.st = st; render();
}

async function showBoard() { phase = qi === N - 1 ? "end" : "board"; await DB.set(`${base}/state`, { phase, q: qi, total: N, title: SESSION.title, club: SESSION.club }); render(); }
async function newGame() { H.ss("edumoon-host-code", ""); location.reload(); }

// ---------- rendering ----------
function timerHTML() { return `<div class="timer"><span class="tnum" id="tnum">${R[qi].time}</span><span class="ttrack"><i id="tbar" style="width:100%"></i></span></div>`; }
function roundPill() {
  const t = { mcq: "Quick quiz", tf: "True or false", type: "Type it", hangman: "Word hunt" }[R[qi].type];
  return `<span class="pill">Round ${qi + 1} of ${N}</span><span class="pill alt">${t}</span>`;
}
function optHTML(opts, st) {
  return `<div class="opts">${opts.map((o, i) => {
    const O = R[qi].type === "tf" ? H.OPT[i === 0 ? 0 : 3] : H.OPT[i];
    let cls = "opt"; if (st) cls += i === st.correct ? " right" : " dim";
    const cnt = st && st.counts ? `<span class="cnt">${st.counts[i] || 0}</span>` : "";
    return `<div class="${cls}" style="background:${O.c};color:${O.ink}"><span class="sym" aria-hidden="true">${O.s}</span><span>${H.esc(o)}</span>${cnt}</div>`;
  }).join("")}</div>`;
}

let copied = false;
function inviteText() {
  return `EduMoon Live is starting!\n${SESSION.club}: ${SESSION.title}\n\nTap to join: ${joinURL()}\nRoom code: ${code}\n\nJust enter your name and you're in. Fastest answers win points!`;
}
async function copyInvite() {
  const t = inviteText();
  try { await navigator.clipboard.writeText(t); }
  catch (e) {
    const ta = document.createElement("textarea"); ta.value = t; document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch (e2) {} ta.remove();
  }
  copied = true; render();
  setTimeout(() => { copied = false; if (phase === "lobby") render(); }, 4000);
}

function render() {
  const S = $("#stage"), n = playerList().length;
  if (phase === "lobby") {
    const url = joinURL();
    S.innerHTML = `<div class="lobby">
      <section class="card joinbox">
        <span class="eyebrow">Join on your phone</span>
        <div class="url">${H.esc(url.replace(/^https?:\/\//, "").split("?")[0])}</div>
        <div><span class="muted" style="font-weight:700">Room code</span><div class="code">${code}</div></div>
        <div class="qr" id="qr" aria-label="QR code to join"></div>
        <div style="display:flex;flex-direction:column;gap:8px">
          <button class="btn" id="copyInvite" type="button" onclick="copyInvite()">${copied ? "Copied! Paste it in Zoom or WhatsApp" : "Copy invite message"}</button>
          <span class="muted" style="font-size:14px">The link already has the room code in it, so students only type their name.</span>
        </div>
      </section>
      <section class="card" style="display:flex;flex-direction:column;gap:18px">
        <div style="display:flex;align-items:center;gap:16px">${H.nova("happy", 72)}<div><div class="count">${n}</div><span class="muted" style="font-weight:700">${n === 1 ? "player" : "players"} in the room</span></div></div>
        <div class="chips">${playerList().map(p => `<span class="chip">${H.esc(p.name)}</span>`).join("") || `<p class="muted">Waiting for the first player… Share the code in the Zoom chat.</p>`}</div>
        <div class="foot"><span class="grow"></span><button class="btn" data-main onclick="startRound(0)">Start game →</button></div>
      </section></div>`;
    const q = $("#qr");
    if (q && window.QRCode) new QRCode(q, { text: url, width: 200, height: 200, colorDark: "#0B1259", colorLight: "#F3F6FC" });
    else if (q) q.innerHTML = `<p style="color:#0B1259;font-weight:700;padding:8px">Open the link above</p>`;
    return;
  }
  if (phase === "question") {
    const r = R[qi], done = Object.keys(answers).length;
    if (r.type === "hangman") {
      const s = hangState(), mask = H.mask(r.word, s.found), longest = Math.max(...r.word.split(" ").map(w => w.length));
      const tw = Math.max(30, Math.min(64, Math.floor(900 / Math.max(longest, 7))));
      S.innerHTML = `<div class="bar">${roundPill()}${timerHTML()}</div>
        <div class="qrow">${H.nova(s.wrong.length >= 4 ? "worried" : "happy", 80)}<h1 class="q">${H.esc(r.q)}</h1></div>
        <div class="hang"><section class="card" style="display:flex;flex-direction:column;gap:24px">
          <div class="tiles" style="--tw:${tw}px">${r.word.split(" ").map((w, wi, arr) => { const off = arr.slice(0, wi).join(" ").length + (wi ? 1 : 0); return `<div class="tw">${[...w].map((c, ci) => `<span class="tile ${mask[off + ci] !== "_" ? "on" : ""}">${mask[off + ci] !== "_" ? c : ""}</span>`).join("")}</div>`; }).join("")}</div>
          <div><span class="muted" style="font-weight:700">Rocket fuel</span><div class="fuel" style="margin-top:8px">${Array.from({ length: H.MAX_WRONG }, (_, i) => `<span class="cell ${i < H.MAX_WRONG - s.wrong.length ? "" : "out"}"></span>`).join("")}</div></div>
          <div class="wrongs" aria-label="Wrong letters">${s.wrong.join(" ")}</div>
          <p class="muted" style="font-size:18px">Tap letters on your phone. +${H.LETTER_PTS} for each letter you find first, +${H.SOLVE_PTS} if you type the whole word!</p>
        </section>
        <section class="card"><span class="eyebrow">Live feed</span><div class="feed" style="margin-top:12px">${s.claims.slice(-7).reverse().map(c => { const ok = H.letters(r.word).includes(c.L); return `<div class="${ok ? "ok" : "no"}"><b>${c.L}</b>${H.esc(c.name)} ${ok ? "found it!" : "missed"}</div>`; }).join("") || `<p class="muted">Letters will appear here as players tap them.</p>`}</div></section></div>
        <div class="foot"><span class="grow"></span><button class="btn ghost" data-main onclick="reveal()">End round</button></div>`;
    } else {
      S.innerHTML = `<div class="bar">${roundPill()}${timerHTML()}</div>
        <div class="qrow">${H.nova("calm", 80)}<h1 class="q">${H.esc(r.q)}</h1></div>
        ${r.type === "type" ? `<section class="card center" style="padding:48px"><span class="eyebrow">Type your answer on your phone</span><p class="big" style="color:var(--soft)">? ? ?</p></section>` : optHTML(r.type === "tf" ? ["True", "False"] : r.options)}
        <div class="foot"><span class="answered"><b>${done}</b> of ${n} answered</span><span class="grow"></span><button class="btn ghost" data-main onclick="reveal()">Show answer</button></div>`;
    }
    tick(); return;
  }
  if (phase === "reveal") {
    const r = R[qi], st = view.st || {};
    let body = "";
    if (r.type === "hangman") body = `<section class="card center"><span class="eyebrow">${st.won ? "Word cracked!" : "Out of fuel! The word was"}</span><p class="big">${H.esc(r.word)}</p>${st.solvedBy ? `<p style="font-size:22px;font-weight:800">${H.esc(st.solvedBy)} solved it! +${H.SOLVE_PTS}</p>` : ""}</section>`;
    else if (r.type === "type") body = `<section class="card center"><span class="eyebrow">The answer</span><p class="big">${H.esc(r.answers[0])}</p><p style="font-size:22px;font-weight:800">${st.right || 0} of ${n} got it</p></section>`;
    else body = optHTML(r.type === "tf" ? ["True", "False"] : r.options, st);
    S.innerHTML = `<div class="bar">${roundPill()}</div>
      <div class="qrow">${H.nova("party", 80)}<h1 class="q">${H.esc(r.q)}</h1></div>${body}
      <div class="learn">${H.nova("happy", 64)}<p>${H.esc(r.learn)}</p></div>
      <div class="foot"><span class="grow"></span><button class="btn" data-main onclick="showBoard()">${qi === N - 1 ? "Final results →" : "Leaderboard →"}</button></div>`;
    return;
  }
  if (phase === "board") {
    const top = ranked().slice(0, 5);
    S.innerHTML = `<div class="bar"><span class="pill">After round ${qi + 1} of ${N}</span></div>
      <div class="qrow">${H.nova("happy", 80)}<h1 class="q">Leaderboard</h1></div>
      <div class="board">${top.map((p, i) => `<div class="brow" style="animation-delay:${i * 90}ms"><span class="rk">${i + 1}</span><span class="nm">${H.esc(p.name)}</span><span class="gain">${p.last ? "+" + p.last : ""}</span><span class="sc">${p.score || 0}</span></div>`).join("") || `<p class="muted">No players yet.</p>`}</div>
      <div class="foot"><span class="grow"></span><button class="btn" data-main onclick="startRound(${qi + 1})">Next round →</button></div>`;
    return;
  }
  if (phase === "end") {
    const all = ranked(), t3 = all.slice(0, 3);
    const order = [1, 0, 2].filter(i => t3[i]);
    const h = [170, 230, 130], col = ["#FFC83D", "#B9C8EC", "#E8A26B"];
    S.innerHTML = `<div class="center">${H.nova("party", 96)}<span class="eyebrow">Final results</span><h1 class="q">Congratulations, stars!</h1></div>
      <div class="podium">${order.map(i => `<div class="pod"><span class="who">${H.esc(t3[i].name)}</span><span class="pts">${t3[i].score || 0} pts</span><div class="blk" style="height:${h[[1, 0, 2].indexOf(i)]}px;background:${col[i]}">${i + 1}</div></div>`).join("")}</div>
      <div class="board">${all.slice(3).map((p, i) => `<div class="brow"><span class="rk">${i + 4}</span><span class="nm">${H.esc(p.name)}</span><span></span><span class="sc">${p.score || 0}</span></div>`).join("")}</div>
      <div class="learn">${H.nova("happy", 64)}<p>Thanks for playing! Join the EduMoon WhatsApp community for next week's game. Bring a friend for bonus points.</p></div>
      <div class="foot"><span class="grow"></span><button class="btn ghost" onclick="newGame()">New game</button></div>`;
  }
}

boot();
</script>
